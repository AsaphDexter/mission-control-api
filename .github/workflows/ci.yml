name: Mission Control API CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build and quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Security audit
        run: npm audit --audit-level=moderate

      - name: Check formatting
        run: npm exec -- prettier --check .

      - name: TypeScript type checking
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Automated tests
        run: npm test

      - name: Production build
        run: npm run build

  postgres-integration:
    name: PostgreSQL concurrency integration tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mission_control_test
          POSTGRES_USER: mission_control_test
          POSTGRES_PASSWORD: mission_control_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mission_control_test -d mission_control_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://mission_control_test:mission_control_test@localhost:5432/mission_control_test?schema=public
      DIRECT_URL: postgresql://mission_control_test:mission_control_test@localhost:5432/mission_control_test?schema=public
      JWT_ACCESS_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Apply database migrations
        run: npm run db:migrate:deploy

      - name: Run PostgreSQL integration tests
        run: npm run test:integration
